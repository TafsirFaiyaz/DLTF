[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true          # required: classifySigned exceeds the 16-slot stack limit otherwise

# Show every revert reason during test output.
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
